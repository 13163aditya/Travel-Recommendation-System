<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Recommendation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .hero-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 3rem;
            max-width: 650px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body>
    <div class="hero-card">
        <h1 class="display-5 fw-bold mb-3">AI Travel Recommendation System</h1>
        <p class="lead mb-4">
            Discover personalized destinations powered by Collaborative Filtering and Machine Learning popularity prediction.
        </p>
        <a href="/recommendation" class="btn btn-warning btn-lg fw-semibold px-4">
            Get Recommendations
        </a>
    </div>
</body>
</html>
